name: sync-portal

on:
  push:
    branches: [main]
    paths:
      - ".sync/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载页面文件
        run: |
          set -e
          mkdir -p docs/data
          curl -fsSL "https://aka.doubaocdn.com/s/BVXykHU8hL" -o docs/index.html
          curl -fsSL "https://aka.doubaocdn.com/s/4jpO2iGiaJ" -o docs/admin.html
          wc -c docs/index.html docs/admin.html

      - name: 提交回仓库
        run: |
          git config user.name "portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/admin.html
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "同步门户页面"
            git push
          fi
